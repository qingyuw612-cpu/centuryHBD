<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Century · 排班</title><link rel="stylesheet" href="css/schedule.css"><script src="js/schedule.js" defer></script></head>
<body><header><a href="/" class="brand">CENTURY <span>排班</span></a><a href="/">返回生日页面 ↗</a></header>
<main><div class="intro"><p class="eyebrow">一起把每一场安排好</p><h1>查看你的演出安排</h1><p>账号经管理员批准后，即可查看已发布的排班。</p></div>
<p id="message" role="status" aria-live="polite" hidden></p>
<section id="auth" class="card"><div class="tabs"><button id="login-tab" class="selected" type="button">登录</button><button id="register-tab" type="button">注册账号</button></div>
<form id="auth-form"><label>用户名<input id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" maxlength="32" required><small>3–32 位英文字母、数字或下划线</small></label><label id="name-label" hidden>姓名<input id="name" name="name" autocomplete="name" maxlength="40"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><small id="password-hint" hidden>至少 15 个字符，建议使用一句只有你知道的话。</small></label><label id="confirm-label" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></label><button id="auth-submit" class="primary" type="submit">登录</button><p id="registration-note" hidden>注册后需由管理员批准。请使用本人姓名，方便管理员确认。</p></form></section>
<section id="account" class="card" hidden><div class="row"><div><h2 id="welcome"></h2><p id="account-state"></p></div><button id="logout" type="button">退出登录</button></div><button id="refresh-account" hidden type="button">重新检查批准状态</button></section>
<section id="schedule-section" hidden><div class="toolbar"><h2>每日排班</h2><div class="row date-row"><button id="prev-day" aria-label="前一天" type="button">←</button><label>日期<input id="day" type="date" required></label><button id="next-day" aria-label="后一天" type="button">→</button><button id="refresh-schedule" type="button">刷新</button></div></div><div id="schedule-view" class="card"></div></section>
<section id="admin" hidden><h2>管理排班</h2><p class="muted">选择上方日期后填写。发布后已批准的账号即可查看；保存为草稿会暂时隐藏当天排班。</p><form id="schedule-form" class="card"><div class="row"><label>演出场次<select id="show-count"><option value="4">4 场</option><option value="5">5 场</option><option value="6">6 场</option></select></label><label>发布状态<select id="published"><option value="false">草稿</option><option value="true">已发布</option></select></label></div><h3>鼓手搭档</h3><p class="muted">每场选择两名不同鼓手，并注明上午或下午。</p><div id="show-fields"></div><h3>其他岗位</h3><p class="muted">填写全天、上午 3 场、下午 2 场、休息或待定等安排。</p><div id="roster-fields" class="grid"></div><h3>鼓手特殊安排</h3><div id="special-fields" class="grid"></div><label>备注<textarea id="schedule-note" maxlength="1000" rows="3"></textarea></label><button id="save-schedule" class="primary" type="submit">保存当天排班</button></form><h2>账号审批</h2><p class="muted">批准后可查看排班；停用后无法登录。普通账号无法修改排班。</p><button id="refresh-users" type="button">刷新账号列表</button><div id="users" class="card"></div></section>
<footer>Century Room · 每一场，都心里有数</footer></main></body></html>
