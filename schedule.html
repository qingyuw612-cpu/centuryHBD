<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演出排班</title><link rel="stylesheet" href="css/schedule.css"><script src="js/schedule.js" defer></script></head>
<body>
<header><a class="brand" href="/">演出排班</a><div id="account" hidden><span id="welcome"></span><button id="logout" class="text-button" type="button">退出</button></div></header>
<main>
<p id="message" role="status" aria-live="polite" hidden></p>
<section id="auth" class="card auth-card"><div class="tabs"><button id="login-tab" class="selected" type="button">登录</button><button id="register-tab" type="button">注册</button></div><form id="auth-form"><label>用户名<input id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" maxlength="32" required></label><label id="name-label" hidden>姓名<input id="name" autocomplete="name" maxlength="40"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><small id="password-hint" hidden>至少 15 个字符</small></label><label id="confirm-label" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></label><button id="auth-submit" class="primary" type="submit">登录</button><small id="registration-note" hidden>注册后等待管理员批准</small></form></section>
<section id="pending" class="card" hidden><h2>等待批准</h2><button id="refresh-account" type="button">刷新</button></section>
<section id="app" hidden>
<div class="toolbar"><div class="date-controls"><button id="prev-day" type="button" aria-label="前一天">←</button><input id="day" type="date" aria-label="日期" required><button id="next-day" type="button" aria-label="后一天">→</button><button id="today" class="text-button" type="button">今天</button></div><div class="view-controls"><div class="tabs compact"><button id="all-view" class="selected" type="button">全体</button><button id="personal-view" type="button">个人</button></div><select id="actor" aria-label="演员" hidden></select><button id="edit" class="primary" type="button" hidden>编辑</button></div></div>
<section id="display" class="card"><div class="section-top"><h1 id="day-title"></h1><span id="show-total" class="muted"></span></div><div id="schedule-view"></div></section>
<section id="editor" class="card" hidden><form id="schedule-form"><div class="section-top"><h2>编辑排班</h2><label class="inline-label">场数<select id="show-count"><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label></div><div id="show-fields" class="table-wrap"></div><details id="personal-records"><summary>个人记录</summary><select id="record-actor" aria-label="记录演员"></select><div id="rest-fields"></div></details><div class="night-section"><h3>晚场</h3><div id="night-fields" class="night-fields"></div></div><div class="form-actions"><button id="cancel-edit" type="button">取消</button><button id="save-schedule" class="primary" type="submit">保存</button></div></form></section>
<details id="accounts" class="card" hidden><summary>账号审批</summary><button id="refresh-users" class="text-button" type="button">刷新</button><div id="users"></div></details>
</section>
</main><footer><a href="birthday.html">生日游戏 ↗</a></footer>
</body></html>
